      properties:
        id: {type: integer, readOnly: true}
        owner:
          type: integer
          readOnly: true
          x-django-field: {type: ForeignKey, to: AUTH_USER_MODEL, on_delete: CASCADE, related_name: courses}
        title:
          type: string
          maxLength: 200
          x-django-field: {type: CharField, max_length: 200}
        code:
          type: string
          maxLength: 32
          default: ''
          x-django-field: {type: CharField, max_length: 32, blank: true, default: ''}
        description:
          type: string
          default: ''
          x-django-field: {type: TextField, blank: true, default: ''}
        term:
          type: string
          maxLength: 64
          default: ''
          x-django-field: {type: CharField, max_length: 64, blank: true, default: ''}
        color:
          type: string
          maxLength: 7
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#6366F1'
          x-django-field: {type: CharField, max_length: 7, default: '#6366F1'}
        position:
          type: integer
          minimum: 0
          default: 0
          x-django-field: {type: PositiveIntegerField, default: 0}
        is_archived:
          type: boolean
          default: false
          x-django-field: {type: BooleanField, default: false}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        document_count: {type: integer, readOnly: true}
        study_kit_count: {type: integer, readOnly: true}
        flashcard_count: {type: integer, readOnly: true}
        mastery_percent: {type: number, readOnly: true, minimum: 0, maximum: 100}

    Document:
      type: object
      x-django-model:
        app: materials
        ordering: [-created_at]
        timestamps: true
        str_field: title
        indexes:
          - {name: mat_doc_course_status_idx, fields: [course, status]}
        constraints:
          - {type: unique, name: mat_doc_course_sha_uniq, fields: [course, sha256], condition: "~models.Q(sha256='')"}
      properties:
        id: {type: integer, readOnly: true}
        course:
          type: integer
          readOnly: true
          x-django-field: {type: ForeignKey, to: Course, on_delete: CASCADE, related_name: documents}
        title:
          type: string
          maxLength: 255
          x-django-field: {type: CharField, max_length: 255}
        original_filename:
          type: string
          maxLength: 255
          readOnly: true
          x-django-field: {type: CharField, max_length: 255}
        file:
          type: string
          format: uri
          readOnly: true
          x-django-field: {type: FileField, upload_to: 'materials/%Y/%m/', max_length: 500}
        file_type:
          $ref: '#/components/schemas/DocumentFileType'
          readOnly: true
          x-django-field: {type: CharField, max_length: 8}
        size_bytes:
          type: integer
          readOnly: true
          minimum: 0
          x-django-field: {type: PositiveBigIntegerField}
